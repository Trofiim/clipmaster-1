name: Build ClipMaster AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o ClipMasterAI-CloudBuild.zip

      - name: Install updated MainActivity
        run: |
          cp MainActivity.java ClipMasterAI-Android/app/src/main/java/com/clipmaster/ai/MainActivity.java

      - name: Verify trimmer
        run: |
          test -f ClipMasterAI-Android/app/src/main/java/com/clipmaster/ai/VideoTrimmer.java
          echo "Trimmer found"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Add Media3 dependencies
        run: |
          FILE="ClipMasterAI-Android/app/build.gradle"
          sed -i '/dependencies {/a\    implementation "androidx.media3:media3-transformer:1.11.1"\n    implementation "androidx.media3:media3-effect:1.11.1"\n    implementation "androidx.media3:media3-common:1.11.1"' "$FILE"

      - name: Build APK
        run: |
          cd ClipMasterAI-Android
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipMasterAI-APK
          path: ClipMasterAI-Android/app/build/outputs/apk/debug/*.apk
