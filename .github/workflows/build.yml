name: Build ClipMaster AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o ClipMasterAI-CloudBuild.zip

      - name: Install updated MainActivity
        run: |
          cp MainActivity.java ClipMasterAI-Android/app/src/main/java/com/clipmaster/ai/MainActivity.java
          
      - name: Install updated VideoTrimmer
        run: |
          cat > ClipMasterAI-Android/app/src/main/java/com/clipmaster/ai/VideoTrimmer.java <<'EOF'
          package com.clipmaster.ai;

          import android.content.Context;
          import android.net.Uri;
          import android.os.Environment;
          import androidx.media3.common.MediaItem;
          import androidx.media3.transformer.Transformer;
          import androidx.media3.transformer.EditedMediaItem;
          import androidx.media3.transformer.ExportException;
          import androidx.media3.transformer.ExportResult;
          import androidx.media3.transformer.Composition;
          import java.io.File;

          public class VideoTrimmer {

              public interface Callback {
                  void onSuccess(String message);
                  void onError(String message);
              }

              public static void trim(Context context, Uri uri, int seconds, Callback callback) {

                  File folder = context.getExternalFilesDir(Environment.DIRECTORY_MOVIES);

                  if (folder == null) {
                      callback.onError("Не удалось создать папку видео.");
                      return;
                  }

                  File output = new File(folder, "clip_" + System.currentTimeMillis() + ".mp4");

                  MediaItem mediaItem = new MediaItem.Builder()
                          .setUri(uri)
                          .setClippingConfiguration(
                                  new MediaItem.ClippingConfiguration.Builder()
                                          .setStartPositionMs(0)
                                          .setEndPositionMs(seconds * 1000L)
                                          .build())
                          .build();

                  EditedMediaItem editedItem =
                          new EditedMediaItem.Builder(mediaItem).build();

                  Transformer transformer = new Transformer.Builder(context)
                          .addListener(new Transformer.Listener() {

                              @Override
                              public void onCompleted(Composition composition, ExportResult result) {
                                  callback.onSuccess("Клип сохранён: " + output.getAbsolutePath());
                              }

                              @Override
                              public void onError(Composition composition, ExportResult result, ExportException exception) {
                                  callback.onError(exception.getMessage());
                              }
                          })
                          .build();

                  transformer.start(editedItem, output.getAbsolutePath());
              }
          }
          EOF

      - name: Install working video screen
        run: |
          cat > ClipMasterAI-Android/app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>ClipMaster AI</title>
          <style>
          body {
            background:#101114;
            color:white;
            font-family:Arial,sans-serif;
            padding:24px;
            text-align:center;
          }
          button,select {
            width:100%;
            padding:16px;
            margin:12px 0;
            border-radius:12px;
            font-size:18px;
          }
          button {
            background:#5b68ff;
            color:white;
            border:0;
          }
          select {
            background:#24252b;
            color:white;
          }
          </style>
          </head>
          <body>
          <h1>ClipMaster AI</h1>
          <p>Нарезка видео на телефоне</p>

          <input id="video" type="file" accept="video/*" style="display:none">

          <button onclick="document.getElementById('video').click()">
          Выбрать видео
          </button>

          <p>Длительность клипа:</p>
          <select id="duration">
            <option value="10">10 секунд</option>
            <option value="15">15 секунд</option>
            <option value="30">30 секунд</option>
            <option value="60">60 секунд</option>
          </select>

          <button onclick="cutVideo()">Начать обрезку</button>

          <p id="status">Выберите видео для обработки.</p>

          <script>
          document.getElementById('video').onchange = function() {
            if (this.files.length > 0) {
              document.getElementById('status').innerText =
                'Видео выбрано. Можно начинать обработку.';
            }
          };

          function cutVideo() {
            let seconds = parseInt(
              document.getElementById("duration").value
            );
            document.getElementById("status").innerText =
              "Запущена обработка видео...";
            AndroidClipper.trimVideo(seconds);
          }

          window.onClipResult = function(message) {
            document.getElementById("status").innerText = message;
          };
          </script>
          </body>
          </html>
          EOF
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable AndroidX and SDK 36
        run: |
          echo "android.useAndroidX=true" > ClipMasterAI-Android/gradle.properties
          sed -i 's/compileSdk 35/compileSdk 36/g' ClipMasterAI-Android/app/build.gradle
          sed -i 's/compileSdkVersion 35/compileSdkVersion 36/g' ClipMasterAI-Android/app/build.gradle

      - name: Add Media3 dependencies
      
        run: |
          FILE="ClipMasterAI-Android/app/build.gradle"
          cat >> "$FILE" <<'EOF'

          dependencies {
              implementation "androidx.media3:media3-transformer:1.11.1"
              implementation "androidx.media3:media3-effect:1.11.1"
              implementation "androidx.media3:media3-common:1.11.1"
          }
          EOF
          cat "$FILE"
      - name: Build APK
        run: |
          cd ClipMasterAI-Android
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipMasterAI-APK
          path: ClipMasterAI-Android/app/build/outputs/apk/debug/*.apk
