name: Build ClipMaster AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o ClipMasterAI-CloudBuild.zip

       - name: Install updated MainActivity
        run: |
          cat > ClipMasterAI-Android/app/src/main/java/com/clipmaster/ai/MainActivity.java <<'EOF'
          package com.clipmaster.ai;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.ValueCallback;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.JavascriptInterface;

          public class MainActivity extends Activity {
              private WebView web;
              private Uri selectedVideo;
              private ValueCallback<Uri[]> fileCallback;
              private static final int PICK_VIDEO = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(
                      new VideoBridge(), "AndroidClipper"
                  );

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                          WebView view,
                          ValueCallback<Uri[]> callback,
                          FileChooserParams params
                      ) {
                          fileCallback = callback;

                          Intent intent = new Intent(
                              Intent.ACTION_GET_CONTENT
                          );
                          intent.setType("video/*");
                          intent.addCategory(
                              Intent.CATEGORY_OPENABLE
                          );

                          startActivityForResult(
                              intent, PICK_VIDEO
                          );
                          return true;
                      }
                  });

                  web.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data
              ) {
                  super.onActivityResult(
                      requestCode, resultCode, data
                  );

                  if (requestCode == PICK_VIDEO) {
                      Uri result = null;

                      if (resultCode == RESULT_OK
                          && data != null) {
                          result = data.getData();
                      }

                      selectedVideo = result;

                      if (fileCallback != null) {
                          fileCallback.onReceiveValue(
                              result == null
                                  ? null
                                  : new Uri[]{result}
                          );
                          fileCallback = null;
                      }

                      if (selectedVideo != null) {
                          sendResult("Видео выбрано.");
                      }
                  }
              }

              private void sendResult(String message) {
                  String safe = message
                      .replace("\\", "\\\\")
                      .replace("'", "\\'")
                      .replace("\n", " ");

                  web.post(() -> web.evaluateJavascript(
                      "window.onClipResult && window.onClipResult('"
                      + safe + "')",
                      null
                  ));
              }

              public class VideoBridge {
                  @JavascriptInterface
                  public void trimVideo(
                      int seconds, int clipCount
                  ) {
                      if (selectedVideo == null) {
                          sendResult(
                              "Сначала выберите видео."
                          );
                          return;
                      }

                      sendResult(
                          "Обработка запущена..."
                      );

                      VideoTrimmer.trim(
                          MainActivity.this,
                          selectedVideo,
                          seconds,
                          clipCount,
                          new VideoTrimmer.Callback() {
                              @Override
                              public void onSuccess(
                                  String message
                              ) {
                                  sendResult(message);
                              }

                              @Override
                              public void onError(
                                  String message
                              ) {
                                  sendResult(
                                      "Ошибка: " + message
                                  );
                              }
                          }
                      );
                  }
              }
          }
          EOF
      - name: Install updated VideoTrimmer
        run: |
          mkdir -p ClipMasterAI-Android/app/src/main/java/com/clipmaster/ai
          cat > ClipMasterAI-Android/app/src/main/java/com/clipmaster/ai/VideoTrimmer.java <<'EOF'
          package com.clipmaster.ai;

          import android.content.Context;
          import android.net.Uri;
          import android.os.Environment;
          import android.media.MediaMetadataRetriever;
          import androidx.media3.common.MediaItem;
          import androidx.media3.transformer.Transformer;
          import androidx.media3.transformer.EditedMediaItem;
          import androidx.media3.transformer.ExportException;
          import androidx.media3.transformer.ExportResult;
          import androidx.media3.transformer.Composition;
          import java.io.File;

          public class VideoTrimmer {

              public interface Callback {
                  void onSuccess(String message);
                  void onError(String message);
              }

              public static void trim(
                  Context context,
                  Uri uri,
                  int seconds,
                  int clipCount,
                  Callback callback
              ) {
                  try {
                      MediaMetadataRetriever retriever =
                          new MediaMetadataRetriever();

                      retriever.setDataSource(context, uri);

                      String durationText = retriever.extractMetadata(
                          MediaMetadataRetriever.METADATA_KEY_DURATION
                      );

                      retriever.release();

                      if (durationText == null) {
                          callback.onError("Не удалось определить длительность видео.");
                          return;
                      }

                      long durationMs = Long.parseLong(durationText);
                      long clipMs = seconds * 1000L;

                      File folder = context.getExternalFilesDir(
                          Environment.DIRECTORY_MOVIES
                      );

                      if (folder == null) {
                          callback.onError("Не удалось создать папку видео.");
                          return;
                      }

                      folder.mkdirs();

                      int total = Math.max(1, Math.min(20, clipCount));

                      long actualClipMs = Math.min(
                          clipMs,
                          durationMs / total
                      );

                      if (actualClipMs <= 0) {
                          callback.onError("Видео слишком короткое.");
                          return;
                      }

                      exportClip(
                          context,
                          uri,
                          folder,
                          actualClipMs,
                          durationMs,
                          0,
                          total,
                          callback
                      );

                  } catch (Exception e) {
                      callback.onError("Ошибка: " + e.getMessage());
                  }
              }

              private static void exportClip(
                  Context context,
                  Uri uri,
                  File folder,
                  long clipMs,
                  long durationMs,
                  int index,
                  int total,
                  Callback callback
              ) {
                  if (index >= total) {
                      callback.onSuccess(
                          "Готово! Создано клипов: " + total
                          + ". Папка: " + folder.getAbsolutePath()
                      );
                      return;
                  }

                  long maxStart = Math.max(0, durationMs - clipMs);

                  long startMs = total == 1
                      ? 0
                      : (maxStart * index) / (total - 1);

                  long endMs = Math.min(startMs + clipMs, durationMs);

                  File output = new File(
                      folder,
                      "clip_" + System.currentTimeMillis()
                      + "_" + (index + 1) + ".mp4"
                  );

                  MediaItem mediaItem = new MediaItem.Builder()
                      .setUri(uri)
                      .setClippingConfiguration(
                          new MediaItem.ClippingConfiguration.Builder()
                              .setStartPositionMs(startMs)
                              .setEndPositionMs(endMs)
                              .build()
                      )
                      .build();

                  EditedMediaItem editedItem =
                      new EditedMediaItem.Builder(mediaItem).build();

                  Transformer transformer = new Transformer.Builder(context)
      
      - name: Install updated VideoTrimmer
        run: |
          mkdir -p ClipMasterAI-Android/app/src/main/java/com/clipmaster/ai
          cat > ClipMasterAI-Android/app/src/main/java/com/clipmaster/ai/VideoTrimmer.java <<'EOF'
          package com.clipmaster.ai;

          import android.content.Context;
          import android.net.Uri;
          import android.os.Environment;
          import android.media.MediaMetadataRetriever;
          import android.content.ContentValues;
          import android.provider.MediaStore;
          import android.os.Build;
          import androidx.media3.common.MediaItem;
          import androidx.media3.transformer.Transformer;
          import androidx.media3.transformer.EditedMediaItem;
          import androidx.media3.transformer.ExportException;
          import androidx.media3.transformer.ExportResult;
          import androidx.media3.transformer.Composition;
          import java.io.File;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.io.FileInputStream;
          import java.io.IOException;
          import java.util.Random;

          public class VideoTrimmer {

              public interface Callback {
                  void onSuccess(String message);
                  void onError(String message);
              }

              public static void trim(
                  Context context,
                  Uri uri,
                  int seconds,
                  int clipCount,
                  Callback callback
              ) {
                  try {
                      MediaMetadataRetriever retriever =
                          new MediaMetadataRetriever();

                      retriever.setDataSource(context, uri);

                      String durationText = retriever.extractMetadata(
                          MediaMetadataRetriever.METADATA_KEY_DURATION
                      );

                      retriever.release();

                      if (durationText == null) {
                          callback.onError("Не удалось определить длительность видео.");
                          return;
                      }

                      long durationMs = Long.parseLong(durationText);
                      int total = Math.max(1, Math.min(20, clipCount));
                      long baseMs = seconds * 1000L;

                      if (durationMs < 1000) {
                          callback.onError("Видео слишком короткое.");
                          return;
                      }

                      Random random = new Random();

                      long[] lengths = new long[total];
                      long[] starts = new long[total];

                      for (int i = 0; i < total; i++) {

                          double variation =
                              0.85 + random.nextDouble() * 0.30;

                          long length = (long)(baseMs * variation);

                          length = Math.max(1000, length);
                          length = Math.min(length, durationMs);

                          lengths[i] = length;
                      }

                      long maxStart = 0;

                      for (int i = 0; i < total; i++) {
                          maxStart = Math.max(
                              maxStart,
                              durationMs - lengths[i]
                          );
                      }

                      for (int i = 0; i < total; i++) {

                          long allowed = durationMs - lengths[i];

                          if (total == 1 || allowed <= 0) {
                              starts[i] = 0;
                              continue;
                          }

                          double slot = (double)allowed / total;

                          double center = slot * i;

                          double jitter = (random.nextDouble() - 0.5)
                              * slot * 0.70;

                          long start = (long)(center + jitter);

                          start = Math.max(0, Math.min(start, allowed));

                          starts[i] = start;
                      }

                      File folder = new File(
                          context.getCacheDir(),
                          "ClipMasterTemp"
                      );

                      if (!folder.exists()) {
                          folder.mkdirs();
                      }

                      exportNext(
                          context,
                          uri,
                          folder,
                          starts,
                          lengths,
                          0,
                          total,
                          callback
                      );

                  } catch (Exception e) {
                      callback.onError("Ошибка: " + e.getMessage());
                  }
              }

              private static void exportNext(
                  Context context,
                  Uri uri,
                  File folder,
                  long[] starts,
                  long[] lengths,
                  int index,
                  int total,
                  Callback callback
              ) {

                  if (index >= total) {
                      callback.onSuccess(
                          "Готово! Создано " + total
                          + " клипов с разнообразной длительностью."
                          + " Сохранено в Movies/Clip Master AI."
                      );
                      return;
                  }

                  long startMs = starts[index];
                  long endMs = startMs + lengths[index];

                  File output = new File(
                      folder,
                      "clip_" + System.currentTimeMillis()
                      + "_" + (index + 1) + ".mp4"
                  );

                  MediaItem mediaItem = new MediaItem.Builder()
                      .setUri(uri)
                      .setClippingConfiguration(
                          new MediaItem.ClippingConfiguration.Builder()
                              .setStartPositionMs(startMs)
                              .setEndPositionMs(endMs)
                              .build()
                      )
                      .build();

                  EditedMediaItem editedItem =
                      new EditedMediaItem.Builder(mediaItem).build();

                  Transformer transformer = new Transformer.Builder(context)
                      .addListener(new Transformer.Listener() {

                          @Override
                          public void onCompleted(
                              Composition composition,
                              ExportResult result
                          ) {
                              try {
                                  saveToGallery(context, output);

                                  exportNext(
                                      context,
                                      uri,
                                      folder,
                                      starts,
                                      lengths,
                                      index + 1,
                                      total,
                                      callback
                                  );

                              } catch (Exception e) {
                                  callback.onError(
                                      "Ошибка сохранения: "
                                      + e.getMessage()
                                  );
                              }
                          }

                          @Override
                          public void onError(
                              Composition composition,
                              ExportResult result,
                              ExportException exception
                          ) {
                              callback.onError(
                                  "Ошибка клипа " + (index + 1)
                                  + ": " + exception.getMessage()
                              );
                          }
                      })
                      .build();

                  transformer.start(
                      editedItem,
                      output.getAbsolutePath()
                  );
              }

              private static void saveToGallery(
                  Context context,
                  File source
              ) throws IOException {

                  ContentValues values = new ContentValues();

                  values.put(
                      MediaStore.Video.Media.DISPLAY_NAME,
                      source.getName()
                  );

                  values.put(
                      MediaStore.Video.Media.MIME_TYPE,
                      "video/mp4"
                  );

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {

                      values.put(
                          MediaStore.Video.Media.RELATIVE_PATH,
                          Environment.DIRECTORY_MOVIES
                          + "/Clip Master AI"
                      );

                      values.put(
                          MediaStore.Video.Media.IS_PENDING,
                          1
                      );
                  }

                  Uri collection =
                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI;

                  Uri videoUri = context.getContentResolver().insert(
                      collection,
                      values
                  );

                  if (videoUri == null) {
                      throw new IOException(
                          "Не удалось создать файл в галерее."
                      );
                  }

                  try (
                      InputStream input =
                          new FileInputStream(source);

                      OutputStream output =
                          context.getContentResolver()
                              .openOutputStream(videoUri)
                  ) {

                      if (output == null) {
                          throw new IOException(
                              "Не удалось открыть файл."
                          );
                      }

                      byte[] buffer = new byte[8192];
                      int length;

                      while ((length = input.read(buffer)) != -1) {
                          output.write(buffer, 0, length);
                      }
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {

                      ContentValues publish = new ContentValues();

                      publish.put(
                          MediaStore.Video.Media.IS_PENDING,
                          0
                      );

                      context.getContentResolver().update(
                          videoUri,
                          publish,
                          null,
                          null
                      );
                  }
              }
          }
          EOF
      
      
      - name: Install working video screen
        run: |
          cat > ClipMasterAI-Android/app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>ClipMaster AI</title>
          <style>
          * {
            box-sizing:border-box;
          }

          body {
            background:#101114;
            color:#ffffff;
            font-family:Arial,sans-serif;
            padding:20px;
            margin:0;
          }

          .container {
            max-width:500px;
            margin:auto;
          }

          h1 {
            font-size:30px;
            margin:10px 0;
          }

          .subtitle {
            color:#aeb0bd;
            margin-bottom:25px;
          }

          .section {
            background:#1b1c22;
            border:1px solid #2c2d35;
            border-radius:16px;
            padding:16px;
            margin:16px 0;
            text-align:left;
          }

          label {
            display:block;
            font-weight:bold;
            margin-bottom:10px;
          }

          select {
            width:100%;
            padding:14px;
            border-radius:12px;
            background:#272830;
            color:white;
            border:1px solid #41424b;
            font-size:16px;
          }

          button {
            width:100%;
            padding:16px;
