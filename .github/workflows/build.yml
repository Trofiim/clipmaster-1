
name: Build ClipMaster AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Extract and inspect project
        run: |
          unzip -o ClipMasterAI-CloudBuild.zip
          echo "===== PROJECT FILES ====="
          find . -type f | head -200

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          
      - name: Show Android source
        run: |
          echo "===== MainActivity.java ====="
          cat ClipMasterAI-Android/app/src/main/java/com/clipmaster/ai/MainActivity.java
          echo "===== app/build.gradle ====="
          cat ClipMasterAI-Android/app/build.gradle
          echo "===== index.html ====="
          cat ClipMasterAI-Android/app/src/main/assets/index.html
          
      - name: Add offline video trimmer
        run: |
          mkdir -p ClipMasterAI-Android/app/src/main/java/com/clipmaster/ai
          cp VideoTrimmer.java ClipMasterAI-Android/app/src/main/java/com/clipmaster/ai/VideoTrimmer.java

      - name: Build APK
        run: |
          cd ClipMasterAI-Android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipMasterAI-APK
          path: ClipMasterAI-Android/app/build/outputs/apk/debug/*.apk
