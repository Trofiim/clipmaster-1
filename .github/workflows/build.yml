      - name: Install updated VideoTrimmer
        run: |
          mkdir -p ClipMasterAI-Android/app/src/main/java/com/clipmaster/ai
          cat > ClipMasterAI-Android/app/src/main/java/com/clipmaster/ai/VideoTrimmer.java <<'EOF'
          package com.clipmaster.ai;

          import android.content.Context;
          import android.net.Uri;
          import android.os.Environment;
          import android.media.MediaMetadataRetriever;
          import android.content.ContentValues;
          import android.provider.MediaStore;
          import android.os.Build;
          import androidx.media3.common.MediaItem;
          import androidx.media3.transformer.Transformer;
          import androidx.media3.transformer.EditedMediaItem;
          import androidx.media3.transformer.ExportException;
          import androidx.media3.transformer.ExportResult;
          import androidx.media3.transformer.Composition;
          import java.io.File;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.io.FileInputStream;
          import java.io.IOException;

          public class VideoTrimmer {

              public interface Callback {
                  void onSuccess(String message);
                  void onError(String message);
              }

              public static void trim(
                  Context context,
                  Uri uri,
                  int seconds,
                  int clipCount,
                  Callback callback
              ) {
                  try {
                      MediaMetadataRetriever retriever =
                          new MediaMetadataRetriever();

                      retriever.setDataSource(context, uri);

                      String durationText = retriever.extractMetadata(
                          MediaMetadataRetriever.METADATA_KEY_DURATION
                      );

                      retriever.release();

                      if (durationText == null) {
                          callback.onError("Не удалось определить длительность видео.");
                          return;
                      }

                      long durationMs = Long.parseLong(durationText);
                      long clipMs = seconds * 1000L;

                      File tempFolder = new File(
                          context.getCacheDir(),
                          "ClipMasterTemp"
                      );

                      if (!tempFolder.exists()) {
                          tempFolder.mkdirs();
                      }

                      int total = Math.max(1, Math.min(20, clipCount));

                      long actualClipMs = Math.min(
                          clipMs,
                          durationMs / total
                      );

                      if (actualClipMs <= 0) {
                          callback.onError("Видео слишком короткое.");
                          return;
                      }

                      exportClip(
                          context,
                          uri,
                          tempFolder,
                          actualClipMs,
                          durationMs,
                          0,
                          total,
                          callback
                      );

                  } catch (Exception e) {
                      callback.onError("Ошибка: " + e.getMessage());
                  }
              }

              private static void exportClip(
                  Context context,
                  Uri uri,
                  File folder,
                  long clipMs,
                  long durationMs,
                  int index,
                  int total,
                  Callback callback
              ) {
                  if (index >= total) {
                      callback.onSuccess(
                          "Готово! Создано клипов: " + total
                          + ". Они сохранены в Movies/Clip Master AI."
                      );
                      return;
                  }

                  long maxStart = Math.max(0, durationMs - clipMs);

                  long startMs = total == 1
                      ? 0
                      : (maxStart * index) / (total - 1);

                  long endMs = Math.min(startMs + clipMs, durationMs);

                  File output = new File(
                      folder,
                      "clip_" + System.currentTimeMillis()
                      + "_" + (index + 1) + ".mp4"
                  );

                  MediaItem mediaItem = new MediaItem.Builder()
                      .setUri(uri)
                      .setClippingConfiguration(
                          new MediaItem.ClippingConfiguration.Builder()
                              .setStartPositionMs(startMs)
                              .setEndPositionMs(endMs)
                              .build()
                      )
                      .build();

                  EditedMediaItem editedItem =
                      new EditedMediaItem.Builder(mediaItem).build();

                  Transformer transformer = new Transformer.Builder(context)
                      .addListener(new Transformer.Listener() {

                          @Override
                          public void onCompleted(
                              Composition composition,
                              ExportResult result
                          ) {
                              try {
                                  saveToGallery(context, output);
                                  exportClip(
                                      context,
                                      uri,
                                      folder,
                                      clipMs,
                                      durationMs,
                                      index + 1,
                                      total,
                                      callback
                                  );
                              } catch (Exception e) {
                                  callback.onError(
                                      "Ошибка сохранения: " + e.getMessage()
                                  );
                              }
                          }

                          @Override
                          public void onError(
                              Composition composition,
                              ExportResult result,
                              ExportException exception
                          ) {
                              callback.onError(
                                  "Ошибка клипа " + (index + 1)
                                  + ": " + exception.getMessage()
                              );
                          }
                      })
                      .build();

                  transformer.start(
                      editedItem,
                      output.getAbsolutePath()
                  );
              }

              private static void saveToGallery(
                  Context context,
                  File source
              ) throws IOException {

                  ContentValues values = new ContentValues();
                  values.put(
                      MediaStore.Video.Media.DISPLAY_NAME,
                      source.getName()
                  );
                  values.put(
                      MediaStore.Video.Media.MIME_TYPE,
                      "video/mp4"
                  );

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      values.put(
                          MediaStore.Video.Media.RELATIVE_PATH,
                          Environment.DIRECTORY_MOVIES
                          + "/Clip Master AI"
                      );
                      values.put(
                          MediaStore.Video.Media.IS_PENDING,
                          1
                      );
                  }

                  Uri collection = MediaStore.Video.Media.EXTERNAL_CONTENT_URI;

                  Uri videoUri = context.getContentResolver().insert(
                      collection,
                      values
                  );

                  if (videoUri == null) {
                      throw new IOException(
                          "Не удалось создать файл в галерее."
                      );
                  }

                  try (
                      InputStream input = new FileInputStream(source);
                      OutputStream output = context.getContentResolver()
                          .openOutputStream(videoUri)
                  ) {
                      if (output == null) {
                          throw new IOException(
                              "Не удалось открыть файл для записи."
                          );
                      }

                      byte[] buffer = new byte[8192];
                      int length;

                      while ((length = input.read(buffer)) != -1) {
                          output.write(buffer, 0, length);
                      }
                  }

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      ContentValues publish = new ContentValues();
                      publish.put(
                          MediaStore.Video.Media.IS_PENDING,
                          0
                      );

                      context.getContentResolver().update(
                          videoUri,
                          publish,
                          null,
                          null
                      );
                  }
              }
          }
          EOF



      - name: Install working video screen
        run: |
          cat > ClipMasterAI-Android/app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>ClipMaster AI</title>
          <style>
          body {
            background:#101114;
            color:white;
            font-family:Arial,sans-serif;
            padding:24px;
            text-align:center;
          }
          button,select {
            width:100%;
            padding:16px;
            margin:12px 0;
            border-radius:12px;
            font-size:18px;
          }
          button {
            background:#5b68ff;
            color:white;
            border:0;
          }
          select {
            background:#24252b;
            color:white;
          }
          </style>
          </head>
          <body>
          <h1>ClipMaster AI</h1>
          <p>Нарезка видео на телефоне</p>

          <input id="video" type="file" accept="video/*" style="display:none">

          <button onclick="document.getElementById('video').click()">
          Выбрать видео
          </button>

          <p>Количество клипов:</p>
          <select id="clipCount">
            <option value="2">2 клипа</option>
            <option value="3">3 клипа</option>
            <option value="5">5 клипов</option>
            <option value="10">10 клипов</option>
            <option value="20">20 клипов</option>
          </select>

          <p>Длительность:</p>
          <select id="duration">
            <option value="10">10 секунд</option>
            <option value="15">15 секунд</option>
            <option value="30">30 секунд</option>
            <option value="60">60 секунд</option>
          </select>

          <p>Соотношение сторон:</p>
          <select id="ratio">
            <option value="9:16">9:16 — вертикальное</option>
            <option value="16:9">16:9 — горизонтальное</option>
            <option value="1:1">1:1 — квадрат</option>
          </select>

          <button onclick="cutVideo()">Начать нарезку</button>

          <p id="status">Выберите видео для обработки.</p>

          <script>
          document.getElementById('video').onchange = function() {
            if (this.files.length > 0) {
              document.getElementById('status').innerText =
                'Видео выбрано. Можно начинать обработку.';
            }
          };

          function cutVideo() {
            let seconds = parseInt(document.getElementById('duration').value);
            let count = parseInt(document.getElementById('clipCount').value);

            document.getElementById('status').innerText =
              'Запущена обработка...';

            AndroidClipper.trimVideo(seconds, count);
          }

          window.onClipResult = function(message) {
            document.getElementById('status').innerText = message;
          };
          </script>
          </body>
          </html>
          EOF
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable AndroidX and SDK 36
        run: |
          echo "android.useAndroidX=true" > ClipMasterAI-Android/gradle.properties
          sed -i 's/compileSdk 35/compileSdk 36/g' ClipMasterAI-Android/app/build.gradle
          sed -i 's/compileSdkVersion 35/compileSdkVersion 36/g' ClipMasterAI-Android/app/build.gradle

      - name: Add Media3 dependencies
      
        run: |
          FILE="ClipMasterAI-Android/app/build.gradle"
          cat >> "$FILE" <<'EOF'

          dependencies {
              implementation "androidx.media3:media3-transformer:1.11.1"
              implementation "androidx.media3:media3-effect:1.11.1"
              implementation "androidx.media3:media3-common:1.11.1"
          }
          EOF
          cat "$FILE"
      - name: Build APK
        run: |
          cd ClipMasterAI-Android
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipMasterAI-APK
          path: ClipMasterAI-Android/app/build/outputs/apk/debug/*.apk
