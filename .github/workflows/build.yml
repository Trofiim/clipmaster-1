            color:#8790ff;
          }
          </style>
          </head>

          <body>
          <div class="container">

          <h1><span class="brand">ClipMaster</span> AI</h1>
          <p class="subtitle">Создание видеоклипов на телефоне</p>

          <input
            id="video"
            type="file"
            accept="video/*"
            style="display:none"
          >

          <button
            class="secondary"
            onclick="document.getElementById('video').click()"
          >
            Выбрать исходное видео
          </button>

          <div class="section">
            <label for="clipCount">Количество клипов</label>
            <select id="clipCount">
              <option value="1">1 клип</option>
              <option value="2">2 клипа</option>
              <option value="3">3 клипа</option>
              <option value="5" selected>5 клипов</option>
              <option value="8">8 клипов</option>
              <option value="10">10 клипов</option>
              <option value="15">15 клипов</option>
              <option value="20">20 клипов</option>
            </select>
            <p class="hint">
              Выбери, сколько отдельных видеороликов создать.
            </p>
          </div>

          <div class="section">
            <label for="duration">Ориентировочная длительность клипа</label>
            <select id="duration">
              <option value="5">5 секунд</option>
              <option value="10">10 секунд</option>
              <option value="15" selected>15 секунд</option>
              <option value="20">20 секунд</option>
              <option value="30">30 секунд</option>
              <option value="45">45 секунд</option>
              <option value="60">60 секунд</option>
            </select>
            <p class="hint">
              Фактическая длительность может немного отличаться
              из-за алгоритма разнообразия.
            </p>
          </div>

          <div class="section">
            <label for="ratio">Формат кадра</label>
            <select id="ratio">
              <option value="9:16">9:16 — вертикальный</option>
              <option value="16:9">16:9 — горизонтальный</option>
              <option value="1:1">1:1 — квадратный</option>
            </select>
            <p class="hint">
              Выбор формата пока сохраняется в интерфейсе.
              Реальное преобразование кадра подключим отдельно.
            </p>
          </div>

          <button onclick="cutVideo()">
            Начать нарезку
          </button>

          <p id="status">
            Выбери видео, количество клипов и длительность.
          </p>

          <script>
          let videoSelected = false;

          document.getElementById('video').onchange = function() {
            if (this.files && this.files.length > 0) {
              videoSelected = true;

              document.getElementById('status').innerText =
                'Видео выбрано. Настрой параметры и нажми Начать нарезку.';
            }
          };

          function cutVideo() {

            let seconds = parseInt(
              document.getElementById('duration').value
            );

            let count = parseInt(
              document.getElementById('clipCount').value
            );

            let ratio = document.getElementById('ratio').value;

            if (!videoSelected) {
              document.getElementById('status').innerText =
                'Сначала выбери исходное видео.';
              return;
            }

            document.getElementById('status').innerText =
              'Запущена обработка. Создаётся ' +
              count + ' клипов...';

            try {
              AndroidClipper.trimVideo(seconds, count);
            } catch (e) {
              document.getElementById('status').innerText =
                'Не удалось запустить обработку: ' + e.message;
            }
          }

          window.onClipResult = function(message) {
            document.getElementById('status').innerText = message;
          };
          </script>

          </div>
          </body>
          </html>
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable AndroidX and SDK 36
        run: |
          echo "android.useAndroidX=true" > ClipMasterAI-Android/gradle.properties
          sed -i 's/compileSdk 35/compileSdk 36/g' ClipMasterAI-Android/app/build.gradle
          sed -i 's/compileSdkVersion 35/compileSdkVersion 36/g' ClipMasterAI-Android/app/build.gradle

      - name: Add Media3 dependencies
      
        run: |
          FILE="ClipMasterAI-Android/app/build.gradle"
          cat >> "$FILE" <<'EOF'

          dependencies {
              implementation "androidx.media3:media3-transformer:1.11.1"
              implementation "androidx.media3:media3-effect:1.11.1"
              implementation "androidx.media3:media3-common:1.11.1"
          }
          EOF
          cat "$FILE"
      - name: Build APK
        run: |
          cd ClipMasterAI-Android
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipMasterAI-APK
          path: ClipMasterAI-Android/app/build/outputs/apk/debug/*.apk
