name: Build ClipMaster AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o ClipMasterAI-CloudBuild.zip

      - name: Install updated MainActivity
        run: |
          cat > ClipMasterAI-Android/app/src/main/java/com/clipmaster/ai/MainActivity.java <<'EOF'
          package com.clipmaster.ai;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.ValueCallback;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.JavascriptInterface;

          public class MainActivity extends Activity {
              private WebView web;
              private Uri selectedVideo;
              private ValueCallback<Uri[]> fileCallback;
              private static final int PICK_VIDEO = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(
                      new VideoBridge(), "AndroidClipper"
                  );

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(
                          WebView view,
                          ValueCallback<Uri[]> callback,
                          FileChooserParams params
                      ) {
                          fileCallback = callback;

                          Intent intent = new Intent(
                              Intent.ACTION_GET_CONTENT
                          );
                          intent.setType("video/*");
                          intent.addCategory(
                              Intent.CATEGORY_OPENABLE
                          );

                          startActivityForResult(
                              intent, PICK_VIDEO
                          );
                          return true;
                      }
                  });

                  web.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data
              ) {
                  super.onActivityResult(
                      requestCode, resultCode, data
                  );

                  if (requestCode == PICK_VIDEO) {
                      Uri result = null;

                      if (resultCode == RESULT_OK
                          && data != null) {
                          result = data.getData();
                      }

                      selectedVideo = result;

                      if (fileCallback != null) {
                          fileCallback.onReceiveValue(
                              result == null
                                  ? null
                                  : new Uri[]{result}
                          );
                          fileCallback = null;
                      }

                      if (selectedVideo != null) {
                          sendResult("Видео выбрано.");
                      }
                  }
              }

              private void sendResult(String message) {
                  String safe = message
                      .replace("\\", "\\\\")
                      .replace("'", "\\'")
                      .replace("\n", " ");

                  web.post(() -> web.evaluateJavascript(
                      "window.onClipResult && window.onClipResult('"
                      + safe + "')",
                      null
                  ));
              }

              public class VideoBridge {
                  @JavascriptInterface
                  public void trimVideo(
                      int seconds, int clipCount
                  ) {
                      if (selectedVideo == null) {
                          sendResult(
                              "Сначала выберите видео."
                          );
                          return;
                      }

                      sendResult(
                          "Обработка запущена..."
                      );

                      VideoTrimmer.trim(
                          MainActivity.this,
                          selectedVideo,
                          seconds,
                          clipCount,
                          new VideoTrimmer.Callback() {
                              @Override
                              public void onSuccess(
                                  String message
                              ) {
                                  sendResult(message);
                              }

                              @Override
                              public void onError(
                                  String message
                              ) {
                                  sendResult(
                                      "Ошибка: " + message
                                  );
                              }
                          }
                      );
                  }
              }
          }
          EOF
      
            
      - name: Install updated VideoTrimmer
        run: |
          mkdir -p ClipMasterAI-Android/app/src/main/java/com/clipmaster/ai
          cat > ClipMasterAI-Android/app/src/main/java/com/clipmaster/ai/VideoTrimmer.java <<'EOF'
          package com.clipmaster.ai;

          import android.content.Context;
          import android.net.Uri;
          import android.os.Environment;
          import android.media.MediaMetadataRetriever;
          import android.content.ContentValues;
          import android.provider.MediaStore;
          import android.os.Build;

          import androidx.media3.common.MediaItem;
          import androidx.media3.common.Effects;
          import androidx.media3.transformer.Transformer;
          import androidx.media3.transformer.EditedMediaItem;
          import androidx.media3.transformer.ExportException;
          import androidx.media3.transformer.ExportResult;
          import androidx.media3.transformer.Composition;
          import androidx.media3.effect.Presentation;

          import java.io.File;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.io.FileInputStream;
          import java.io.IOException;
          import java.util.Collections;
          import java.util.Random;

          public class VideoTrimmer {

              public interface Callback {
                  void onSuccess(String message);
                  void onError(String message);
              }

              public static void trim(
                  Context context,
                  Uri uri,
                  int seconds,
                  int clipCount,
                  String ratio,
                  Callback callback
              ) {
                  try {
                      MediaMetadataRetriever retriever =
                          new MediaMetadataRetriever();

                      retriever.setDataSource(context, uri);

                      String durationText = retriever.extractMetadata(
                          MediaMetadataRetriever.METADATA_KEY_DURATION
                      );

                      retriever.release();

                      if (durationText == null) {
                          callback.onError(
                              "Не удалось определить длительность видео."
                          );
                          return;
                      }

                      long durationMs =
                          Long.parseLong(durationText);

                      int total = Math.max(
                          1, Math.min(20, clipCount)
                      );

                      long baseMs = seconds * 1000L;

                      if (durationMs < 1000) {
                          callback.onError(
                              "Видео слишком короткое."
                          );
                          return;
                      }

                      float targetRatio;

                      if ("9:16".equals(ratio)) {
                          targetRatio = 9f / 16f;
                      } else if ("1:1".equals(ratio)) {
                          targetRatio = 1f;
                      } else {
                          targetRatio = 16f / 9f;
                      }

                      Random random = new Random();

                      long[] lengths = new long[total];
                      long[] starts = new long[total];

                      for (int i = 0; i < total; i++) {
                          double variation =
                              0.85 + random.nextDouble() * 0.30;

                          long length = (long)(
                              baseMs * variation
                          );

                          length = Math.max(1000, length);
                          length = Math.min(length, durationMs);

                          lengths[i] = length;
                      }

                      for (int i = 0; i < total; i++) {
                          long allowed =
                              durationMs - lengths[i];

                          if (total == 1 || allowed <= 0) {
                              starts[i] = 0;
                              continue;
                          }

                          double slot =
                              (double) durationMs / total;

                          double center = slot * i;

                          double jitter =
                              (random.nextDouble() - 0.5)
                              * slot * 0.70;

                          long start = (long)(
                              center + jitter
                          );

                          start = Math.max(
                              0, Math.min(start, allowed)
                          );

                          starts[i] = start;
                      }

                      File folder = new File(
                          context.getCacheDir(),
                          "ClipMasterTemp"
                      );

                      if (!folder.exists()) {
                          folder.mkdirs();
                      }

                      exportNext(
                          context,
                          uri,
                          folder,
                          starts,
                          lengths,
                          0,
                          total,
                          targetRatio,
                          callback
                      );

                  } catch (Exception e) {
                      callback.onError(
                          "Ошибка: " + e.getMessage()
                      );
                  }
              }

              private static void exportNext(
                  Context context,
                  Uri uri,
                  File folder,
                  long[] starts,
                  long[] lengths,
                  int index,
                  int total,
                  float targetRatio,
                  Callback callback
              ) {

                  if (index >= total) {
                      callback.onSuccess(
                          "Готово! Создано " + total
                          + " клипов. Формат кадра применён."
                          + " Сохранено в Movies/Clip Master AI."
                      );
                      return;
                  }

                  long startMs = starts[index];
                  long endMs = startMs + lengths[index];

                  File output = new File(
                      folder,
                      "clip_" + System.currentTimeMillis()
                      + "_" + (index + 1) + ".mp4"
                  );

                  MediaItem mediaItem = new MediaItem.Builder()
                      .setUri(uri)
                      .setClippingConfiguration(
                          new MediaItem.ClippingConfiguration.Builder()
                              .setStartPositionMs(startMs)
                              .setEndPositionMs(endMs)
                              .build()
                      )
                      .build();

                  Presentation presentation =
                      Presentation.createForAspectRatio(
                          targetRatio,
                          Presentation.LAYOUT_SCALE_TO_FIT_WITH_CROP
                      );

                  EditedMediaItem editedItem =
                      new EditedMediaItem.Builder(mediaItem)
                          .setEffects(
                              new Effects(
                                  Collections.emptyList(),
                                  Collections.singletonList(
                                      presentation
                                  )
                              )
                          )
                          .build();

                  Transformer transformer =
                      new Transformer.Builder(context)
                          .addListener(
                              new Transformer.Listener() {

                                  @Override
                                  public void onCompleted(
                                      Composition composition,
                                      ExportResult result
                                  ) {
                                      try {
                                          saveToGallery(
                                              context, output
                                          );

                                          exportNext(
                                              context,
                                              uri,
                                              folder,
                                              starts,
                                              lengths,
                                              index + 1,
                                              total,
                                              targetRatio,
                                              callback
                                          );

                                      } catch (Exception e) {
                                          callback.onError(
                                              "Ошибка сохранения: "
                                              + e.getMessage()
                                          );
                                      }
                                  }

                                  @Override
                                  public void onError(
                                      Composition composition,
                                      ExportResult result,
                                      ExportException exception
                                  ) {
                                      callback.onError(
                                          "Ошибка клипа "
                                          + (index + 1)
                                          + ": "
                                          + exception.getMessage()
                                      );
                                  }
                              }
                          )
                          .build();

                  transformer.start(
                      editedItem,
                      output.getAbsolutePath()
                  );
              }

              private static void saveToGallery(
                  Context context,
                  File source
              ) throws IOException {

                  ContentValues values =
                      new ContentValues();

                  values.put(
                      MediaStore.Video.Media.DISPLAY_NAME,
                      source.getName()
                  );

                  values.put(
                      MediaStore.Video.Media.MIME_TYPE,
                      "video/mp4"
                  );

                  if (Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.Q) {

                      values.put(
                          MediaStore.Video.Media.RELATIVE_PATH,
                          Environment.DIRECTORY_MOVIES
                          + "/Clip Master AI"
                      );

                      values.put(
                          MediaStore.Video.Media.IS_PENDING,
                          1
                      );
                  }

                  Uri collection =
                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI;

                  Uri videoUri =
                      context.getContentResolver().insert(
                          collection, values
                      );

                  if (videoUri == null) {
                      throw new IOException(
                          "Не удалось создать файл в галерее."
                      );
                  }

                  try (
                      InputStream input =
                          new FileInputStream(source);

                      OutputStream output =
                          context.getContentResolver()
                              .openOutputStream(videoUri)
                  ) {

                      if (output == null) {
                          throw new IOException(
                              "Не удалось открыть файл."
                          );
                      }

                      byte[] buffer = new byte[8192];
                      int length;

                      while ((length =
                          input.read(buffer)) != -1) {
                          output.write(buffer, 0, length);
                      }
                  }

                  if (Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.Q) {

                      ContentValues publish =
                          new ContentValues();

                      publish.put(
                          MediaStore.Video.Media.IS_PENDING,
                          0
                      );

                      context.getContentResolver().update(
                          videoUri,
                          publish,
                          null,
                          null
                      );
                  }

                  source.delete();
              }
          }
          EOF               

      
      - name: Install working video screen
        run: |
          cat > ClipMasterAI-Android/app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>ClipMaster AI</title>
          <style>
          * { box-sizing: border-box; }
          body {
            margin: 0;
            padding: 20px;
            background: #101114;
            color: #ffffff;
            font-family: Arial, sans-serif;
          }
          .card {
            max-width: 500px;
            margin: auto;
            padding: 22px;
            background: #1c1d22;
            border-radius: 22px;
          }
          h1 { text-align: center; }
          p { color: #b7b7c1; }
          label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
          }
          select, input, button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid #44454d;
            background: #292a31;
            color: white;
            font-size: 16px;
          }
          button {
            margin-top: 22px;
            background: #6955e8;
            border: none;
            font-weight: bold;
          }
          button:active { opacity: 0.7; }
          #status {
            margin-top: 18px;
            text-align: center;
            color: #b9aaff;
            overflow-wrap: anywhere;
          }
          </style>
          </head>
          <body>
          <div class="card">
          <h1>ClipMaster AI</h1>
          <p>Создание коротких видеоклипов на телефоне</p>

          <label>Исходное видео</label>
          <input type="file" id="video" accept="video/*">

          <label>Количество клипов</label>
          <select id="count">
            <option value="1">1 клип</option>
            <option value="2">2 клипа</option>
            <option value="3">3 клипа</option>
            <option value="5" selected>5 клипов</option>
            <option value="8">8 клипов</option>
            <option value="10">10 клипов</option>
            <option value="15">15 клипов</option>
            <option value="20">20 клипов</option>
          </select>

          <label>Длительность клипа</label>
          <select id="seconds">
            <option value="5">5 секунд</option>
            <option value="10">10 секунд</option>
            <option value="15" selected>15 секунд</option>
            <option value="20">20 секунд</option>
            <option value="30">30 секунд</option>
            <option value="45">45 секунд</option>
            <option value="60">60 секунд</option>
          </select>

          <label>Формат кадра</label>
          <select id="ratio">
            <option value="9:16">9:16 — вертикальный</option>
            <option value="16:9">16:9 — горизонтальный</option>
            <option value="1:1">1:1 — квадрат</option>
          </select>

          <button onclick="startCutting()">Начать нарезку</button>

          <div id="status">Выберите видео для начала.</div>
          </div>

          <script>
          let videoSelected = false;

          document.getElementById("video").onchange = function() {
            videoSelected = this.files.length > 0;
            document.getElementById("status").innerText =
              videoSelected ? "Видео выбрано." : "Выберите видео.";
          };

          window.onClipResult = function(message) {
            document.getElementById("status").innerText = message;
          };

          function startCutting() {
            if (!videoSelected) {
              document.getElementById("status").innerText =
                "Сначала выберите видео.";
              return;
            }

            let seconds = parseInt(
              document.getElementById("seconds").value
            );

            let count = parseInt(
              document.getElementById("count").value
            );

            let ratio = document.getElementById("ratio").value;

            document.getElementById("status").innerText =
              "Запуск обработки...";

            AndroidClipper.trimVideo(seconds, count, ratio);
          }
          </script>
          </body>
          </html>
               }
          }
          }
          EOF


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable AndroidX and SDK 36
        run: |
          echo "android.useAndroidX=true" > ClipMasterAI-Android/gradle.properties
          sed -i 's/compileSdk 35/compileSdk 36/g' ClipMasterAI-Android/app/build.gradle
          sed -i 's/compileSdkVersion 35/compileSdkVersion 36/g' ClipMasterAI-Android/app/build.gradle

      - name: Add Media3 dependencies
      
        run: |
          FILE="ClipMasterAI-Android/app/build.gradle"
          cat >> "$FILE" <<'EOF'

          dependencies {
              implementation "androidx.media3:media3-transformer:1.11.1"
              implementation "androidx.media3:media3-effect:1.11.1"
              implementation "androidx.media3:media3-common:1.11.1"
          }
          EOF
          cat "$FILE"
      - name: Build APK
        run: |
          cd ClipMasterAI-Android
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClipMasterAI-APK
          path: ClipMasterAI-Android/app/build/outputs/apk/debug/*.apk
